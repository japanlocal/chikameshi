<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e8590c">
  <title>ちかめし</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ちかめし">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <h1>🍽️ ちかめし</h1>
    <div class="header-actions">
      <button id="install-btn" class="secondary" type="button" hidden>📲 インストール</button>
      <button id="settings-btn" class="icon-btn" type="button" aria-label="設定">⚙️</button>
    </div>
  </header>

  <main>
    <div id="ios-install-hint" class="install-hint" hidden>
      <p>📲 ホーム画面に追加するとアプリとして使えます<br>
        <small>Safari の <b>共有ボタン</b>（□↑）→「<b>ホーム画面に追加</b>」</small></p>
      <button type="button" class="icon-btn" id="ios-install-close" aria-label="閉じる">✕</button>
    </div>

    <div id="search-view">
    <section class="card" id="location-card">
      <div class="location-row">
        <span id="location-status">📍 現在地を取得していません</span>
        <button id="locate-btn" type="button" class="secondary">現在地を取得</button>
      </div>
      <div id="map"></div>
      <p class="hint">地図をタップすると検索地点を変更できます</p>
    </section>

    <form id="search-form" class="card">
      <div class="field">
        <label for="people">👥 人数</label>
        <div class="stepper">
          <button type="button" data-step="-1" aria-label="減らす">−</button>
          <input id="people" type="number" min="1" max="50" value="2" inputmode="numeric">
          <span>人</span>
          <button type="button" data-step="1" aria-label="増やす">＋</button>
        </div>
      </div>

      <div class="field">
        <span class="label">✨ 空気感</span>
        <div class="chips" id="vibe-chips" role="radiogroup"></div>
      </div>

      <div class="field">
        <span class="label">🍜 食べたいもの <small>(複数選択可)</small></span>
        <div class="chips" id="food-chips"></div>
        <input id="keyword" type="text" placeholder="キーワードでも探せます（例: もつ鍋、ハンバーグ）">
      </div>

      <div class="field">
        <label for="budget">💴 予算 (1人あたり)</label>
        <select id="budget"></select>
      </div>

      <div class="field">
        <label for="radius">🚶 検索範囲</label>
        <select id="radius">
          <option value="300">300m（徒歩4分）</option>
          <option value="500">500m（徒歩6分）</option>
          <option value="1000" selected>1km（徒歩13分）</option>
          <option value="2000">2km（徒歩25分）</option>
          <option value="3000">3km</option>
        </select>
      </div>

      <button id="search-btn" type="submit" class="primary">おすすめを探す</button>
    </form>

    <section id="results-section" hidden>
      <div class="results-header">
        <h2 id="results-title">おすすめ</h2>
        <span id="source-badge" class="badge"></span>
      </div>
      <p id="results-note" class="hint"></p>
      <div id="results-tools" class="results-tools">
        <select id="sort" aria-label="並び替え">
          <option value="score">おすすめ順</option>
          <option value="distance">近い順</option>
          <option value="price">安い順</option>
        </select>
        <button id="roulette-btn" type="button" class="secondary">🎲 迷ったらおまかせ</button>
      </div>
      <ol id="results" class="results"></ol>
    </section>
    </div>

    <section id="favorites-view" hidden>
      <h2 class="view-title">❤️ お気に入り</h2>
      <ul id="favorites-list" class="results"></ul>
    </section>
  </main>

  <nav class="tab-bar" role="tablist">
    <button type="button" role="tab" data-tab="search" aria-selected="true"><span>🔍</span>さがす</button>
    <button type="button" role="tab" data-tab="favorites" aria-selected="false">
      <span>❤️</span>お気に入り<b id="fav-count" class="count"></b>
    </button>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <footer class="app-footer" id="credit"></footer>

  <dialog id="settings-dialog">
    <form method="dialog">
      <h2>設定</h2>
      <label for="api-key">ホットペッパーグルメ APIキー</label>
      <input id="api-key" type="text" autocomplete="off" placeholder="未設定なら OpenStreetMap で検索">
      <p class="hint">
        APIキーを設定すると、予算・個室・飲み放題・収容人数などの詳しい情報で絞り込めます。<br>
        <a href="https://webservice.recruit.co.jp/register/" target="_blank" rel="noopener">無料でAPIキーを取得する</a>
      </p>
      <div class="dialog-actions">
        <button value="cancel" class="secondary">キャンセル</button>
        <button value="save" id="save-settings" class="primary">保存</button>
      </div>
    </form>
  </dialog>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="data.js"></script>
  <script src="sources.js"></script>
  <script src="app.js"></script>
</body>
</html>
